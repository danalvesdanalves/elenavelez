<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Elena Velez</title>
  <meta name="theme-color" content="#000000">
  <link rel="preload" href="/fonts/SharpEarthMonoVF.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <a class="logo" href="#/" aria-label="Elena Velez — home">
    <img src="/logo.svg" alt="Elena Velez" width="142" height="29">
  </a>

  <main>
    <section class="page" id="page-home">
      <video
        class="hero-video"
        id="hero-video"
        src="https://elenavelez.com/cdn/shop/videos/c/vp/d42e12164b75414eb027d5aa79dd9eeb/d42e12164b75414eb027d5aa79dd9eeb.HD-1080p-7.2Mbps-76784402.mp4"
        autoplay
        muted
        loop
        playsinline
        webkit-playsinline
        preload="auto"
        disablepictureinpicture
        tabindex="-1"
        aria-hidden="true"></video>
    </section>

    <section class="page" id="page-shop">
      <p class="placeholder">Shop</p>
    </section>

    <section class="page" id="page-cart">
      <p class="placeholder">Cart</p>
    </section>
  </main>

  <div class="scrim" aria-hidden="true"></div>

  <nav class="nav">
    <a href="#/" data-route="home">Home</a>
    <a href="#/shop" data-route="shop">Shop</a>
    <a href="#/cart" data-route="cart">Cart</a>
  </nav>

  <script>
    (function () {
      var ROUTES = ['home', 'shop', 'cart'];

      var hero = document.getElementById('hero-video');

      /* Browsers refuse to start video-only media in a hidden tab, and the
         promise rejects. Retry when the page becomes visible, and once more on
         first interaction, so the hero is never left frozen on frame one. */
      function playHero() {
        if (!hero) { return; }
        hero.muted = true;
        var attempt = hero.play();
        if (attempt && attempt.catch) { attempt.catch(function () {}); }
      }

      function pauseHero() {
        if (hero) { hero.pause(); }
      }

      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && current() === 'home') { playHero(); }
      });

      ['pointerdown', 'touchstart', 'keydown'].forEach(function (evt) {
        window.addEventListener(evt, function once() {
          if (current() === 'home') { playHero(); }
          ['pointerdown', 'touchstart', 'keydown'].forEach(function (e2) {
            window.removeEventListener(e2, once);
          });
        }, { passive: true });
      });

      function current() {
        var hash = location.hash.replace(/^#\/?/, '');
        return ROUTES.indexOf(hash) > -1 ? hash : 'home';
      }

      function render() {
        var route = current();
        ROUTES.forEach(function (name) {
          document.getElementById('page-' + name)
            .classList.toggle('is-active', name === route);
        });
        document.querySelectorAll('.nav a').forEach(function (a) {
          a.classList.toggle('is-active', a.dataset.route === route);
          if (a.dataset.route === route) {
            a.setAttribute('aria-current', 'page');
          } else {
            a.removeAttribute('aria-current');
          }
        });
        if (route === 'home') { playHero(); } else { pauseHero(); }

        document.title = route === 'home'
          ? 'Elena Velez'
          : 'Elena Velez — ' + route.charAt(0).toUpperCase() + route.slice(1);
      }

      window.addEventListener('hashchange', render);
      render();
    })();
  </script>

</body>
</html>
