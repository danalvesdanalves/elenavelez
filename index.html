<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elena Velez</title>
  <link rel="preload" href="/fonts/SharpEarthMonoVF.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* Sharp Earth Mono VF — axes: wght 100–800, slnt 0–8.
       The slnt axis runs 0 → +8 (inverted from the OpenType convention), so
       `font-style: oblique` does nothing: browsers negate the angle and it
       clamps back to 0. Italics must go through font-variation-settings. */
    @font-face {
      font-family: "Sharp Earth Mono";
      src: url("/fonts/SharpEarthMonoVF.woff2") format("woff2");
      font-weight: 100 800;
      font-style: normal;
      font-display: swap;
    }

    :root {
      color-scheme: light dark;
      --bg: #fff;
      --fg: #111;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0a0a0a; --fg: #f5f5f5; }
    }

    html, body { height: 100%; margin: 0; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: "Sharp Earth Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    /* Italic — use this instead of font-style. */
    i, em, .italic { font-variation-settings: "slnt" 8; font-style: normal; }
  </style>
</head>
<body>
  <main>Elena Velez</main>
</body>
</html>
